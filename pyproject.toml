[project]
name = "commonwealth-mcp"
version = "0.1.0.dev0"
description = "MCP servers for Virginia state and local public data, with provenance on every answer."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    # Exact-pin per DECISIONS.md 0003: this is an application/deployment tree, not
    # a published library. Bump deliberately, with the compat spike re-run.
    "mcp==2.1.1",
    "httpx==0.28.1",
    "pydantic==2.13.4",
    "pyyaml==6.0.3",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[project.scripts]
commonwealth = "commonwealth.cli.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/commonwealth"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
