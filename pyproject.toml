[project]
name = "commonwealth-mcp"
version = "0.1.0.dev0"
description = "MCP servers for Virginia state and local public data, with provenance on every answer."
requires-python = ">=3.12"
license = "Apache-2.0"
# Code only. The registry under sources/ is CC0 and docs prose is
# CC-BY-4.0; see NOTICE for the split and THIRD_PARTY_DATA.yml for
# the government content this repo redistributes.
dependencies = [
    # Exact-pin per design/architecture.md decision 0003: this is an application/deployment tree, not
    # a published library. Bump deliberately, with the compat spike re-run.
    "mcp==2.1.1",
    "httpx==0.28.1",
    "pydantic==2.13.4",
    "pyyaml==6.0.3",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[project.scripts]
commonwealth = "commonwealth.cli.__main__:main"
# The registry runs a PyPI server as `uvx <package-name>`, which looks for
# an executable named after the package. Without this alias that lookup
# fails and the published listing's install line does not work.
commonwealth-mcp = "commonwealth.cli.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/commonwealth"]

# The registry, the jurisdiction table and the skills are data the runtime
# reads at start, not code, and a wheel installed outside a checkout has no
# repo root to find them in. They ship inside the package instead;
# `runtime._data_root()` prefers that copy and a test asserts the two lists
# agree. `sources/` carries its own CC0 licence and NOTICE explains the
# split, so both travel with the data rather than only with the repo.
[tool.hatch.build.targets.wheel.force-include]
"sources" = "commonwealth/_data/sources"
"plugins/commonwealth-mcp/skills" = "commonwealth/_data/skills"
"NOTICE" = "commonwealth/_data/NOTICE"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
