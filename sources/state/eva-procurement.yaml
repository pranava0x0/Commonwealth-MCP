  known_limitations:
    - >
      No endpoint discovery has run. Whether eVA exposes solicitations or
      awards through anything other than its own web UI is an open
      question, not a recorded finding.
    - >
      Procurement records name private parties, so the data-classification
      review here is a real one rather than a formality — an award record
      is public, a losing bidder's contact details may not be.

authority_notes: >
  eVA is the Commonwealth's system of record for state procurement, so it
  is primary for solicitations and awards it carries. Local procurement
  runs on locality systems and is not covered by it.

