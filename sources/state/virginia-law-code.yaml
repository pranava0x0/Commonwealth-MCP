# The Code of Virginia is publicly readable at law.lis.virginia.gov with
# no key or registration. This manifest said until 2026-09-08 that the
# JSON/XML API the developer portal advertises was a separate key-gated
# program; that was wrong. The gated program is the LEGISLATIVE API at
# lis.virginia.gov (bills and members, GitHub issue #11). The law site's
# own API at /api/ answers unauthenticated, and is registered here as a
# second capability. It carries the Code's table of contents and no
# full-text search operation at all (design/source-quirks.md § 18).
# Section text still comes from the HTML pages, which are the primary
# published text. Endpoint structure and the "not found" redirect
# behavior verified live 2026-08-28; the API verified live 2026-09-08.
id: va-code-of-virginia
name: Code of Virginia (law.lis.virginia.gov)
jurisdiction: va

publisher:
  agency: Division of Legislative Automated Systems (DLAS), Virginia General Assembly
  authority_level: primary

domains: [civic]

capabilities:
  - id: code_section.lookup
    tool_hint: civic.get_code_section
  - id: code_structure.browse
    tool_hint: civic.browse_code

adapter:
  type: virginia_law
  service_url: https://law.lis.virginia.gov/vacode
  api_url: https://law.lis.virginia.gov/api

access:
  mode: anonymous
  automation_status: public_api
  terms_url: https://law.lis.virginia.gov/vacode/
  terms_notes: >
    Publicly served, anonymous, no rate-limit or robots restriction found
    on the section pages themselves as of the review date. The site's own
    developer portal (law.lis.virginia.gov/developers/) advertises
    RESTful JSON and XML services; re-checked 2026-09-08, they are
    anonymous and keyless, served from the same host under the same
    terms, and both endpoints are read here. The keyed program is the
    separate legislative API at lis.virginia.gov (GitHub issue #11).
    Re-review with the standard 12-month cadence.
  terms_reviewed_at: "2026-09-08"
  data_classification: open

freshness:
  expected_cadence: unknown
  cadence_source: >
    Updated on the legislature's own session/codification schedule; no
    published SLA for how quickly a signed act reaches this page.
  ttl_hint_seconds: 86400

coverage:
  geography: va
  temporal: current
  known_limitations:
    - No full-text search. The publisher's own search endpoint is public
      and keyless and its backend answered every query with "The Search
      Appliance is down" on 2026-09-08; its JSON API has no search
      operation among the twenty-three it serves. Reaching a section
      means knowing the citation or walking the table of contents to it.
    - Browsing returns the publisher's own table of contents and nothing
      about what a section says. A chapter's title is a heading, not a
      summary of the law under it.
    - Section text is parsed from the site's HTML, not read from a
      structured API — a redesign of the markup would break parsing
      before it broke any published contract. The table of contents does
      come from the publisher's JSON, and is not exposed to that.
    - No machine-readable last-edit date per section; retrieval time is
      known, the underlying text's amendment date is only what the
      section's own citation-history paragraph states in prose.

authority_notes: >
  This is the Division of Legislative Automated Systems' own publication
  of the Code of Virginia — the primary published text, not a secondary
  aggregation of it.

health:
  probe: virginia_law_section_fetch
  expect:
    # A known, stable section (unlikely to be repealed/renumbered) used
    # as a liveness check: found=True and non-empty body text.
    known_section: "1-500"

lifecycle:
  declared_state: active
  added: "2026-08-28"
  last_verified: "2026-09-08"
  verified_by: pranava0x0
