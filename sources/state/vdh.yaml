# Inventory only: closes GitHub issue #9 with a documented absence rather
# than a manifest. The investigation and its evidence are in
# coverage.known_limitations; the short version is that VDH publishes plenty
# of data and none of it in a shape this registry can route a query to.
id: va-vdh
name: Virginia Department of Health (no queryable endpoint found)
jurisdiction: va

publisher:
  agency: Virginia Department of Health (VDH)
  authority_level: primary

domains: [health]

# None. design/source-registry.md § 1 rule 2 makes a capability id a routing
# promise, and there is nothing here to route to. The capability this source
# would answer if an endpoint appeared is named in authority_notes.
capabilities: []

adapter:
  type: none

access:
  mode: anonymous
  automation_status: unknown
  terms_url: https://www.vdh.virginia.gov/terms-of-use/
  terms_notes: >
    Not reviewed. There is nothing to review terms for until an endpoint
    exists; the URL is recorded so the review starts in the right place.
  data_classification: open

freshness:
  expected_cadence: unknown
  cadence_source: unknown
  ttl_hint_seconds: 86400

coverage:
  geography: va
  temporal: current
  known_limitations:
    - >
      Checked 2026-08-29. `gis.vdh.virginia.gov` does not resolve
      (NXDOMAIN), so the ArcGIS REST directory the other state publishers
      expose has no VDH equivalent.
    - >
      Checked 2026-08-29. VDH does publish through the state open-data
      portal: 144 datasets under the `virginia-department-of-health`
      organization on data.virginia.gov. Every resource sampled is a CSV
      download of an aggregate public-use dataset (COVID-19, mpox,
      healthcare-associated infections, heat-related illness), not a
      record-shaped service that answers a query about a place or a
      facility. A bulk CSV is a real publication and a poor fit for a
      capability whose contract is "look this up".
    - >
      Checked 2026-08-29. No licensed-facility or inspection registry with
      an API surfaced under VDH. Health-professional licensing sits with
      the Department of Health Professions, a separate agency and a
      separate future manifest, not this one.
    - >
      Absence of an endpoint is not absence of data. This row exists so the
      gap is inventory rather than memory, and re-checking it is a
      re-verification of this manifest rather than a fresh search.

authority_notes: >
  VDH is named in design/source-registry.md § 6's seed list. If an endpoint
  appears, the capability it would answer is a facility or inspection
  lookup, which carries disclosure weight parcels do not: a licensed-
  facility list is not a quality rating and an inspection record is not a
  current condition, and any tool built here has to say so in the
  agent-facing string. Nothing is wired up, so nothing says it yet.

health:
  probe: none
  expect: {}

lifecycle:
  declared_state: proposed
  added: "2026-08-29"
  last_verified: "2026-08-29"
  verified_by: pranava0x0
