# Capability vocabulary (design/source-registry.md § 1 rule 2).
# Adding an id is a reviewed change; routing tables derive from this file.
# No authority_order blocks: ../design/architecture.md decision 0005 (Chosen) removed central ranking —
# selection takes the top two selectable sources and queries both.
capabilities:
  - id: parcel.lookup
    description: Find a parcel record by parcel identifier (PIN) or point.
  - id: zoning.lookup
    description: Find the zoning district(s) applying to a parcel or point.
  - id: code_section.lookup
    description: Get the text of a Code of Virginia section by citation.
  - id: boundary.lookup
    description: >
      Get a jurisdiction's official boundary polygon and identity
      attributes (FIPS, GNIS, area, jurisdiction type).
  - id: address.lookup
    description: >
      Find address-point records at a coordinate or matching an address
      string. Returns what the address publisher has on record; an address
      absent from the layer is not evidence that no such address exists.
  - id: geocode.address
    description: >
      Turn a typed address or place string into candidate coordinates with
      a match score. A coordinate, never a jurisdiction: the jurisdiction
      comes from running that coordinate through boundary.lookup.
  - id: building.lookup
    description: >
      Find building footprints at or near a coordinate, or on a parcel.
      A missing footprint is not evidence that the ground is vacant.
  - id: landmark.lookup
    description: >
      Find named public places — schools, libraries, fire stations, parks
      — from the publisher's curated list. Not an inventory: absence
      proves nothing.
  - id: road.lookup
    description: >
      Find road segments or routes by street name or near a coordinate.
      Two publishers answer this, an operating agency and an aggregation
      of local submissions, and they disagree in ways that are real.
  - id: environmental_site.lookup
    description: >
      Find the environmental monitoring stations and regulated sites a
      state environmental agency has on record near a location. A station
      on record means the agency monitors that spot and nothing more.
