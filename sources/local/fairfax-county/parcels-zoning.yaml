# One manifest per source system: Fairfax County's OpenData_A9 FeatureServer
# carries both the Parcels and Zoning layers. Endpoint, layer ids, and field
# names verified live 2026-08-27 (service root -> OpenData folder -> layers
# 0/1); neither layer publishes editingInfo.lastEditDate, so source_updated_at
# is genuinely null at query time (freshness_unavailable warning).
id: va-fairfax-parcels-zoning
name: Fairfax County Parcels and Zoning (Open Data)
jurisdiction: va:fairfax-county

publisher:
  agency: Fairfax County government (GIS and Mapping Services, Open Data)
  authority_level: primary

domains: [geo, planning]

capabilities:
  - id: parcel.lookup
    tool_hint: geo.find_parcel
  - id: zoning.lookup
    tool_hint: geo.find_zoning

adapter:
  type: arcgis
  service_url: https://www.fairfaxcounty.gov/mercator/rest/services/OpenData/OpenData_A9/FeatureServer
  field_mapping_version: "1"
  layers:
    parcels:
      layer_id: 0
      id_field: OBJECTID
      geometry: polygon
      field_mapping:
        pin: PIN
        parcel_type: PARCEL_TYPE
    zoning:
      layer_id: 1
      id_field: OBJECTID
      geometry: polygon
      field_mapping:
        district: ZONECODE
        zone_type: ZONETYPE
        proffered: PROFFER
        overlay_jurisdiction: JURISDICTION

access:
  mode: anonymous
  automation_status: public_api
  terms_url: https://www.fairfaxcounty.gov/maps/disclaimer
  terms_notes: >
    County GIS disclaimer page (URL verified 2026-08-27). Layers are published
    through the county's public Open Data ArcGIS folder with anonymous query
    enabled. No bulk-restriction language located as of the review date;
    re-review with the standard 12-month cadence.
  terms_reviewed_at: "2026-08-27"
  data_classification: open

freshness:
  expected_cadence: daily
  cadence_source: unknown
  ttl_hint_seconds: 86400

coverage:
  geography: va:fairfax-county
  temporal: current
  known_limitations:
    - GIS zoning is a screening representation; the adopted zoning ordinance
      and official zoning map govern.
    - Neither layer publishes a machine-readable last-edit date.

authority_notes: >
  County-published layers are the primary GIS representation for Fairfax
  County parcels and zoning. Screening evidence; confirm controlling adopted
  records where a legal determination is required.

health:
  probe: arcgis_layer_count
  expect:
    # Floors reset 2026-09-02 from a range rather than a single reading
    # (GitHub issue #19). Two observations per layer now sit in
    # docs/audits/probe-history.json — the registration-day count and a
    # live re-probe days later — and every layer moved by under 0.05%
    # between them. The rule: ten per cent under the lowest reading,
    # rounded down to two significant figures, and never looser than the
    # floor it replaces. Two readings days apart cannot see an annual
    # reassessment or a bulk republish, so ten per cent is deliberately
    # slack; `tools/upstream_audit.py` keeps adding readings and the
    # floors tighten as the range earns it.
    # The PIN the fixture is recorded against. Declared rather than taken
    # from whatever the layer returns first: row order moved on a
    # 2026-09-02 re-record and renamed the sample PIN, which fifteen
    # tests, examples, and the site generator refer to by name. A refresh
    # must not be able to rename what everything is written against.
    sample_pin: "0102 14  0231"
    min_features:
      parcels: 330000
      zoning: 5700

lifecycle:
  declared_state: active
  added: "2026-08-27"
  last_verified: "2026-08-27"
  verified_by: pranava0x0
