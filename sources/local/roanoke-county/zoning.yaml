id: va-roanoke-county-zoning
name: Roanoke County Zoning Open Data
jurisdiction: va:roanoke-county
publisher:
  agency: Roanoke County GIS Services
  authority_level: primary
domains: [geo, planning]
capabilities:
  - id: zoning.lookup
    tool_hint: geo.find_zoning
adapter:
  type: arcgis
  service_url: https://services1.arcgis.com/VlZ73DcE2ya6FnSK/arcgis/rest/services/Zoning_Hosted/FeatureServer
  field_mapping_version: "1"
  layers:
    zoning:
      layer_id: 0
      id_field: OBJECTID
      geometry: polygon
      field_mapping:
        pin: ParcelID
        district: Zoning
        district_description: Zoning_Description
        assessment_primary: Primary_
        split: Split
access:
  mode: anonymous
  automation_status: public_api
  terms_url: https://www.arcgis.com/home/item.html?id=5f6e5905dd3f442aafeeccfb1173387e
  terms_notes: >-
    Roanoke County labels this item CC BY without specifying a version.
    Credit Roanoke County GIS Services. The recording selects and maps
    fields from the published layer. The county provides the data as is.
  terms_reviewed_at: "2026-11-03"
  data_classification: open
freshness:
  expected_cadence: unknown
  cadence_source: The layer exposes an edit timestamp but gives no zoning-specific update schedule.
  ttl_hint_seconds: 86400
coverage:
  geography: va:roanoke-county
  temporal: current
  known_limitations:
    - A split parcel can have multiple zoning rows. Primary marks the county assessment designation only.
    - The county notes that the layer includes some land taxed in adjacent jurisdictions. A match does not establish jurisdiction or permitted use.
authority_notes: >-
  County GIS publishes this polygon layer separately from parcel boundaries.
  ParcelID links the district polygons to a county parcel number. This is
  not the independent City of Roanoke's zoning map.
health:
  probe: arcgis_layer_count
  expect:
    sample_point: [-80.055, 37.225]
    sample_pin: "098.02-02-16.00-0000"
    min_features:
      zoning: 42000  # 46,903 polygons on 2026-11-03.
lifecycle:
  declared_state: active
  added: "2026-11-03"
  last_verified: "2026-11-03"
  verified_by: pranava0x0
