# Loudoun County: the county the registry most conspicuously did not
# cover. Every demo walk that needed a registry gap used Loudoun, because
# a Sterling mailing address resolved to a county with no local source —
# and Loudoun is the data-centre corridor, so it is also the county most
# likely to be asked about.
#
# The county runs its own ArcGIS server. Endpoint, layer ids and field
# names verified live 2026-09-10 against a point in Leesburg and a point
# in Ashburn.
#
# PA_MCPI is the same parcel identifier the Town of Leesburg republishes
# (see sources/local/leesburg-town/parcels-zoning.yaml, which says so
# from the other side), so one parcel number reaches the town layer, the
# county layer and VGIN's statewide one.
id: va-loudoun-county-parcels-zoning
name: Loudoun County Parcels and Zoning (Loudoun County GIS)
jurisdiction: va:loudoun-county

publisher:
  agency: Loudoun County government (Office of Mapping and Geographic Information)
  authority_level: primary

domains: [geo, planning]

capabilities:
  - id: parcel.lookup
    tool_hint: geo.find_parcel
  - id: zoning.lookup
    tool_hint: geo.find_zoning

adapter:
  type: arcgis
  service_url: https://logis.loudoun.gov/gis/rest/services/COL/LandRecords/MapServer
  field_mapping_version: "1"
  layers:
    parcels:
      layer_id: 5
      id_field: OBJECTID
      geometry: polygon
      field_mapping:
        pin: PA_MCPI
        acres: PA_LEGAL_ACRE
        square_feet: PA_LEGAL_SQFT
        subdivision: PA_SUBD_NAME
        plat_number: PA_PLAT_NUM
        parcel_type: PA_TYPE
        last_updated: PA_UPD_DATE
    zoning:
      layer_id: 3
      id_field: OBJECTID
      geometry: polygon
      # Zoning is a separate service on the same host, the way Richmond's
      # and Leesburg's are.
      service_url: https://logis.loudoun.gov/gis/rest/services/COL/Zoning/MapServer
      field_mapping:
        district: ZO_ZONE
        # The ordinance the district is written under. Loudoun runs two
        # in parallel — the 1972 ordinance still governs some ground and
        # has its own layer — so which ordinance a district belongs to is
        # part of the answer, not a footnote.
        district_description: ZO_ZONE_ORD
        ordinance: ZO_ORDINANCE
        special_code: ZO_SPEC_CODE
        last_updated: ZO_UPD_DATE

access:
  mode: anonymous
  automation_status: public_api
  terms_url: https://logis.loudoun.gov/metadata/Zoning.html
  terms_notes: >
    The county's own layer metadata carries the terms, read 2026-09-10:
    "Every reasonable effort has been made to assure the accuracy of
    these data. Loudoun County, Virginia does not assume any liability
    arising from the use of these data. These data are provided without
    warranty of any kind, expressed or implied... Reliance on these data
    is at the risk of the user. These data were generated for use by
    Loudoun County and are available to the public. These data are
    intended for use at 1:2400 scale or smaller. Acknowledgement of
    Loudoun County would be appreciated in products derived from this
    data." Public by the publisher's own statement, with a scale limit
    that is recorded as a coverage limitation rather than buried here.
  terms_reviewed_at: "2026-09-10"
  data_classification: open

freshness:
  expected_cadence: unknown
  cadence_source: >
    Each record carries the county's own update date; the service
    publishes no cadence for the layer as a whole.
  ttl_hint_seconds: 86400

coverage:
  geography: va:loudoun-county
  temporal: current
  known_limitations:
    - >
      Intended by the publisher for use at 1:2400 scale or smaller.
      A boundary read off this layer is not a survey and does not
      establish where a line falls on the ground.
    - >
      Zoning here is the county's GIS rendering of its adopted ordinance,
      not the ordinance. The adopted Loudoun County Zoning Ordinance
      governs, and a district shown here is screening evidence.
    - >
      Loudoun maintains two zoning ordinances in parallel. The registered
      layer is the current one; ground still governed by the 1972
      ordinance is carried on a separate layer that is not registered
      here, so a district read from this source is the current
      ordinance's answer and may not be the only one that applies.
    - >
      The incorporated towns inside Loudoun — Leesburg among them — adopt
      and administer their own zoning. A point inside a town returns the
      county's layer and the town's where one is registered, and the town
      is the government that zones it.

authority_notes: >
  Loudoun County's own publication of its own parcel and zoning records,
  served from the county's GIS. The Town of Leesburg republishes this
  county's parcel identifier (PA_MCPI) in its own layer, which is why one
  parcel number reaches both; where the two disagree, each is returned
  under its own publisher rather than merged.

health:
  probe: arcgis_layer_count
  expect:
    parcels:
      min_expected: 100000
    zoning:
      min_expected: 1000
    # The Town of Leesburg sits inside this county and publishes its own
    # parcel and zoning layers, so a Leesburg query reaches the town's
    # source and this one. These are the town's own sample PIN and
    # points; recording them here is what keeps the town's existing
    # fixtures replaying now that the county is registered.
    also_record:
      pins: ["231154488000"]
      points:
        - [-77.5747034849779, 39.1101411032017]
        - [-77.408014727372, 39.025534437083]

lifecycle:
  declared_state: active
  added: "2026-09-10"
  last_verified: "2026-09-10"
  verified_by: pranava0x0
