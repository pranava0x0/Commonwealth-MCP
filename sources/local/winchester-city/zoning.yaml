id: va-winchester-city-zoning
name: City of Winchester Zoning
jurisdiction: va:winchester-city
publisher:
  agency: City of Winchester, Virginia (GIS)
  authority_level: primary
domains: [geo, planning]
capabilities:
  - id: zoning.lookup
    tool_hint: geo.find_zoning

adapter:
  type: arcgis
  service_url: https://gis.winchesterva.gov/arcgis/rest/services/Winchester/Zoning/MapServer
  field_mapping_version: "1"
  layers:
    zoning:
      layer_id: 0
      id_field: OBJECTID
      geometry: polygon
      field_mapping:
        district: MZONE
        district_description: Name

access:
  mode: anonymous
  automation_status: public_api
  terms_url: https://www.arcgis.com/home/item.html?id=ad0eecdf518d4595bd5aeabb582e8962
  terms_notes: >-
    The City's Zoning item links to this layer and licenses the data under
    Creative Commons Attribution 4.0 International
    (https://creativecommons.org/licenses/by/4.0/). Credit the City of
    Winchester, Virginia, and identify changes. The city disclaims warranties
    and says this data is not a legal description. The sample records selected
    fields from the city's query response, not a copy of the complete layer.
  terms_reviewed_at: "2026-11-03"
  data_classification: open

freshness:
  expected_cadence: unknown
  cadence_source: No layer editing timestamp or publication schedule was found on the service.
  ttl_hint_seconds: 86400
coverage:
  geography: va:winchester-city
  temporal: current
  known_limitations:
    - Base zoning districts only. Separate overlay layers are not queried.
    - The district shown at a point is screening evidence; confirm permitted uses with the city.
authority_notes: >-
  Winchester publishes the layer on its own GIS server. The state portal
  lists the dataset for discovery; it does not supply the zoning record.
health:
  probe: arcgis_layer_count
  expect:
    sample_point: [-78.164, 39.185]
    min_features:
      zoning: 730  # 821 polygons on 2026-11-03; roughly 90% of the initial count.
lifecycle:
  declared_state: active
  added: "2026-11-03"
  last_verified: "2026-11-03"
  verified_by: pranava0x0
