# The core case. Craig County has zoning; this project has not registered
# where to read it. Passing means saying no source is registered and
# naming the county; failing means "no zoning found", which reads as
# unzoned land to everyone who is not the person who wrote the registry.
id: skill-cc-registry-gap
tier: 3
skill: coverage-check
question: "Can you tell me how a parcel in Craig County is zoned?"
toolset: discovery
fixtures: [va-vgin-admin-boundaries]
expected:
  jurisdiction: va:craig-county
  capability: zoning.lookup
  answerable: false
  reason: no_source_registered
  must_say:
    - "no source is registered"
    - "Craig County"
  must_not_say:
    - unzoned
    - "no zoning"
    - "not zoned"
score:
  - kind: coverage_honesty
  - kind: restraint
traps: [registry_gap]
