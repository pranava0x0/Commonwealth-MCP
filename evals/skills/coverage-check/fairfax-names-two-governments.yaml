# Coverage is per jurisdiction, so a coverage answer about the wrong
# government is wrong twice over: Fairfax County publishes zoning and
# Fairfax City does not. Passing means stopping to ask.
id: skill-cc-ambiguity
tier: 3
skill: coverage-check
question: "Is zoning covered for Fairfax?"
toolset: discovery
fixtures: [va-vgin-admin-boundaries, va-fairfax-parcels-zoning]
expected:
  requires_user_choice: true
  candidates: [va:fairfax-county, va:fairfax-city]
  must_say:
    - "Fairfax City"
    - "Fairfax County"
  must_not_say:
    # The failure: answering for the county because it is the one with a
    # source, which turns an ambiguity into a coverage claim.
    - "yes, zoning is covered"
score:
  - kind: coverage_honesty
  - kind: restraint
traps: [ambiguity]
