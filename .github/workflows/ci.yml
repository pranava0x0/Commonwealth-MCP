# What CONTRIBUTING.md has been telling contributors runs on every pull
# request. It did not run anywhere until 2026-09-02; the claim is true now.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . --group dev

      - name: Tests, with the network switched off
        # The suite replays recorded government responses. The deny switch
        # turns that from a habit into a property the process enforces, so
        # a test that reaches for a live service fails here rather than
        # sending traffic to a government host from CI (GitHub issue #39).
        env:
          COMMONWEALTH_DENY_NETWORK: "1"
        run: python -m pytest -q

      - name: The recorded fixtures are unchanged
        # A run that rewrites a fixture is the bug #39 closed. This is the
        # assertion that keeps it closed.
        run: git diff --exit-code -- tests/fixtures/

      - name: Writing checker
        run: python tools/check_writing.py --code
